name: Focused Milestone6 production serve diagnosis
on:
  push:
    paths:
      - '.github/workflows/media-compatibility-serve.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  serve-matrix:
    runs-on: windows-2022
    timeout-minutes: 8
    env:
      CGO_ENABLED: '0'
      GOAMD64: v1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experimental-media-source-and-binaries
          path: media-candidate
          run-id: 41346172469
          github-token: ${{ github.token }}
      - name: Execute same image matrix through actual serve and upload routes
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD='1'
          npm install --prefix "$env:RUNNER_TEMP/m6-serve-deps" --no-audit --no-fund playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser harness setup failed' }
          $env:IMMICH_BROWSER_MODULE="$env:RUNNER_TEMP/m6-serve-deps/node_modules/playwright"
          python -m pip install --only-binary=:all: --require-hashes --no-deps -r experiments/media-ai/requirements.txt --disable-pip-version-check
          if ($LASTEXITCODE -ne 0) { throw 'Pinned fixture tools unavailable' }
          $root=Join-Path $env:RUNNER_TEMP 'm6-serve-binary'
          New-Item -ItemType Directory $root | Out-Null
          ./scripts/Prepare-MediaProvider.ps1 -Destination "$root/media/ffmpeg-8.1.3-7eb77d88e2e9"
          python -B experiments/media-compatibility/prepare.py "$root/fixtures"
          if ($LASTEXITCODE -ne 0) { throw 'Independent fixture generation failed' }
          go build -mod=readonly -o "$root/immichclone.exe" ./cmd/immichclone
          if ($LASTEXITCODE -ne 0) { throw 'Production app build failed' }
          $env:IMMICH_COMPAT_BINARY="$root/immichclone.exe"
          $env:IMMICH_COMPAT_FIXTURES="$root/fixtures"
          node tests/media-compatibility-serve.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual serve image matrix failed' }
