name: Deletion full-disk acceptance
on:
  push:
    paths:
      - '.github/workflows/deletion-disk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-ntfs:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
      - name: Exhaust mapped reserve and execute full-volume recovery
        shell: pwsh
        run: ./scripts/Test-FullDisk.ps1
