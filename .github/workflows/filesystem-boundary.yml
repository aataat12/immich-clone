name: SEC-03 handle-bound filesystem candidate
on:
  push:
    paths:
      - '.github/workflows/filesystem-boundary.yml'
      - 'internal/winfs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  filesystem-boundary:
    # Installer integration executes the same primitive suite in its single gate.
    if: ${{ !contains(github.event.head_commit.message, '[installer-trust]') }}
    runs-on: windows-2022
    timeout-minutes: 6
    env:
      CGO_ENABLED: '0'
      GOAMD64: v1
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify existing pinned dependencies
        run: go mod verify
      - name: Execute real NTFS handle and adversarial replacement controls
        shell: pwsh
        run: |
          go test -mod=readonly -v -count=1 -timeout=120s ./internal/winfs
          if ($LASTEXITCODE -ne 0) { throw 'Filesystem boundary acceptance failed' }
          go vet ./internal/winfs
          if ($LASTEXITCODE -ne 0) { throw 'Filesystem boundary vet failed' }
