name: Bounded source-built media worker
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: minimal-media-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Provision build-only cross compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64
      - name: Build pinned minimal upstream source and retain corresponding source
        run: bash experiments/media-worker/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experimental-media-source-and-binaries
          path: media-candidate/*
          retention-days: 7
