name: Release 0.1.43 combined acceptance
# Prior-writer fixture uses real LocalService because 0.1.42 refuses elevated serve.
# Browser navigation checks gallery filtering, and Setup uses the same current notes as packaging.
# Prototype0.1.43 delivery: genuine0.1.42 upgrade/rollback, full providers and independent recovery.
on:
  push:
    branches: ['work/release-0.1.43']
    paths: ['.github/workflows/application.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    # Focused installer-trust commits use their dedicated real-Setup gate first.
    # Do not rebuild or attempt to republish the existing release for those commits.
    if: ${{ !contains(github.event.head_commit.message, '[installer-trust]') }}
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
      GOAMD64: v1
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experimental-media-source-and-binaries
          path: media-candidate
          run-id: 41346172469
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experimental-native-ai-build-not-accepted
          path: native-ai-candidate
          run-id: 41551816976
          github-token: ${{ github.token }}
      - name: Require accepted feature and independent automatic naming evidence
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $manifest=Get-Content docs/release-0.1.43-feature-acceptance.json -Raw|ConvertFrom-Json
          if(!$manifest.accepted){throw 'Feature acceptance is not recorded'}
          $headers=@{Accept='application/vnd.github+json';Authorization=('Bearer '+$env:GITHUB_TOKEN);'X-GitHub-Api-Version'='2022-11-28'}
          foreach($gate in @(@{Source=$manifest.feature_source;Run=$manifest.feature_run;Jobs=$manifest.feature_jobs},@{Source=$manifest.independent_source;Run=$manifest.independent_run;Jobs=$manifest.independent_jobs})){
            if($gate.Source -notmatch '^[0-9a-f]{40}$'){throw 'Accepted source identity is invalid'}
            $run=Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/actions/runs/$($gate.Run)" -Headers $headers
            if($run.head_sha -ne $gate.Source -or $run.status -ne 'completed' -or $run.conclusion -ne 'success'){throw 'Required feature or independent quality run did not pass'}
            $jobs=Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/actions/runs/$($gate.Run)/jobs?per_page=100" -Headers $headers
            foreach($id in $gate.Jobs){if(@($jobs.jobs|Where-Object{[int64]$_.id -eq [int64]$id -and $_.conclusion -eq 'success'}).Count -ne 1){throw 'Required acceptance job did not pass'}}
            $compare=Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/compare/$($gate.Source)...$env:GITHUB_SHA" -Headers $headers
            if($compare.status -notin @('ahead','identical') -or $compare.behind_by -ne 0){throw 'Candidate does not contain accepted feature source'}
          }
          foreach($file in $manifest.canonical_git_blobs.psobject.Properties){
            $actual=git rev-parse ('HEAD:'+$file.Name)
            if($LASTEXITCODE -ne 0 -or $actual -ne $file.Value){throw ('Candidate differs from the tested canonical feature source: '+$file.Name)}
          }
      - name: Download and verify permanent published 0.1.42 baseline
        shell: pwsh
        run: |
          $url = 'https://github.com/aataat12/immich-clone/releases/download/v0.1.42-prototype/ImmichClone-0.1.42-prototype-x64-setup.exe'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'previous-installer/ImmichClone-0.1.42-prototype-x64-setup.exe'
          New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
          Invoke-WebRequest $url -OutFile $dest
          $expected = '18dbc670ce4d46809e2a90d5831d17b31f633050907290082f1e793294df8b87'
          $actual = (Get-FileHash $dest).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Published 0.1.42 installer checksum mismatch' }
          "IMMICH_PRIOR_INSTALLER=$dest" >> $env:GITHUB_ENV
      - name: Require accepted full Setup concurrency handoff
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content docs/combined-validation-concurrency.json -Raw | ConvertFrom-Json
          if (!$manifest.accepted -or !$manifest.source -or [int64]$manifest.run -le 0 -or [int64]$manifest.job -le 0) {
            throw 'Combined SEC-03 gate is intentionally blocked until the versioned full Setup concurrency acceptance manifest is populated'
          }
          if ($manifest.source -notmatch '^[0-9a-f]{40}$') { throw 'Concurrency source must be a full commit SHA' }
          $headers = @{ Accept='application/vnd.github+json'; Authorization=('Bearer '+$env:GITHUB_TOKEN); 'X-GitHub-Api-Version'='2022-11-28' }
          $compare = Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/compare/32749aa5dc59b238af1c59a5b0ecff1b29ef8e66...$($manifest.source)" -Headers $headers
          if ($compare.status -ne 'ahead' -or $compare.behind_by -ne 0) { throw 'Concurrency source is not a descendant of the accepted recovery checkpoint' }
          $run = Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/actions/runs/$([int64]$manifest.run)" -Headers $headers
          if ($run.head_sha -ne $manifest.source -or $run.status -ne 'completed' -or $run.conclusion -ne 'success') { throw 'Recorded concurrency run is not a successful completed run for the recorded source' }
          $jobs = Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/actions/runs/$([int64]$manifest.run)/jobs?per_page=100" -Headers $headers
          $job = @($jobs.jobs | Where-Object { [int64]$_.id -eq [int64]$manifest.job })[0]
          if (!$job -or $job.conclusion -ne 'success') { throw 'Recorded concurrency job is missing or not successful' }
          "IMMICH_FULL_CONCURRENCY_SOURCE=$($manifest.source)" >> $env:GITHUB_ENV
          "IMMICH_FULL_CONCURRENCY_RUN=$([int64]$manifest.run)" >> $env:GITHUB_ENV
      - name: Validate installer script syntax before lengthy acceptance
        shell: pwsh
        run: |
          foreach ($file in @('scripts/Build-Installer.ps1','scripts/Test-Installer.ps1','scripts/Test-Application.ps1','scripts/Test-AutomaticSchemaInstaller.ps1')) {
            $tokens=$null;$parseErrors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($file+': '+($parseErrors.Message -join '; ')) }
          }
      - name: Verify complete pinned provider inputs
        shell: pwsh
        run: |
          $media = @{
            'ffmpeg.exe'='7eb77d88e2e97afff0844d8df1408ec10f9ca66fac58f6971112cefd25fb6a0f'
            'ffprobe.exe'='0ba24b17e5b42e02de441fb053dacca08aa52ac4f7f38e0845bda7df6b73a6e6'
            'ffmpeg-8.1.3-source.tar.gz'='57421c6be6861f26d1dc9edf384a9d1ab6410cc0b247b2502f415df83443fe4b'
          }
          foreach ($item in $media.GetEnumerator()) {
            if (!(Test-Path "media-candidate/$($item.Key)")) { throw "Missing pinned media input: $($item.Key)" }
            if ((Get-FileHash "media-candidate/$($item.Key)").Hash.ToLowerInvariant() -ne $item.Value) { throw "Pinned media input hash mismatch: $($item.Key)" }
          }
          $worker='native-ai-candidate/ai-worker.exe'
          if (!(Test-Path $worker) -or (Get-FileHash $worker).Hash.ToLowerInvariant() -ne '15d1c2ca7ef3f526b34ac4823f9337c51280ad171ddf43df4f3af5d8128a7c58') { throw 'Pinned AI worker input mismatch' }
      - name: Verify dependency checksums and execute storage, recovery and HTTP tests
        shell: pwsh
        run: |
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'Module verification failed' }
          go test -mod=readonly -v ./internal/... ./cmd/immichclone
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          go vet ./internal/... ./cmd/immichclone
          if ($LASTEXITCODE -ne 0) { throw 'Vet failed' }
      - name: Check Windows Go dependency vulnerabilities
        shell: pwsh
        run: ./scripts/Test-GoSecurity.ps1
      - name: Execute ENOSPC recovery on bounded disposable NTFS volumes
        shell: pwsh
        run: ./scripts/Test-FullDisk.ps1
      - name: Execute full application service and backup restoration
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/browser-deps" --no-audit --no-fund playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependency acquisition failed' }
          $env:IMMICH_BROWSER_MODULE = "$env:RUNNER_TEMP/browser-deps/node_modules/playwright"
          "IMMICH_BROWSER_MODULE=$env:IMMICH_BROWSER_MODULE" >> $env:GITHUB_ENV
          $env:IMMICH_BROWSER_OUTPUT = "$env:GITHUB_WORKSPACE/browser-evidence"
          New-Item -ItemType Directory $env:IMMICH_BROWSER_OUTPUT | Out-Null
          ./scripts/Test-UIRedesign.ps1 -Version '0.1.43-prototype'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Prepare public installed6A acceptance fixtures
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'installed6A'
          New-Item -ItemType Directory $root -Force | Out-Null
          python -m pip install --only-binary=:all: --require-hashes --no-deps -r experiments/media-ai/requirements.txt --disable-pip-version-check
          if ($LASTEXITCODE -ne 0) { throw 'Fixture tooling failed' }
          python -B experiments/media-ai/prepare.py $root
          if ($LASTEXITCODE -ne 0) { throw 'Fixture generation failed' }
          ./experiments/media-ai/prepare.ps1 -Root $root
          "IMMICH_6A_FIXTURES=$root" >> $env:GITHUB_ENV
          $compatRoot=Join-Path $env:RUNNER_TEMP 'installed-media-compatibility'
          python -B experiments/media-compatibility/prepare.py $compatRoot
          if ($LASTEXITCODE -ne 0) { throw 'Independent media compatibility fixtures failed' }
          "IMMICH_COMPAT_FIXTURES=$compatRoot" >> $env:GITHUB_ENV
      - name: Execute integrated SEC-06 hostile corpus and media parity
        shell: pwsh
        run: |
          go test -mod=readonly -v -count=1 -timeout=4m ./internal/library ./internal/web -run SEC06
          if ($LASTEXITCODE -ne 0) { throw 'Integrated SEC-06 tests failed' }
          ./scripts/Test-MediaCompatibility.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Integrated media compatibility failed' }
      - name: Build pinned installer and test install upgrade rollback and uninstall
        shell: pwsh
        run: |
          ./scripts/Build-Installer.ps1
          $env:IMMICH_BROWSER_OUTPUT = Join-Path $env:GITHUB_WORKSPACE 'browser-evidence'
          ./scripts/Test-Installer.ps1
          ./scripts/Test-AutomaticSchemaInstaller.ps1
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-browser-evidence
          path: |
            browser-evidence/*.png
            ${{ runner.temp }}/installed6A/paint-*.png
          retention-days: 7
      - name: Retain tested prototype only after all checks pass
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prototype-0.1.43-server-tested
          path: |
            dist/ImmichClone-0.1.43-prototype-x64-setup.exe
            dist/SHA256SUMS.txt
            docs/validation-0.1.43.md
            docs/release-notes-0.1.43.md
          retention-days: 7
