name: Bounded media service operations
on:
  workflow_run:
    workflows: ['Bounded source-built media worker']
    types: [completed]
  push:
    paths:
      - 'experiments/media-worker/*_windows.go'
      - 'experiments/media-worker/go.mod'
      - 'internal/media/**'
      - 'experiments/media-worker/fixtures/**'
      - '.github/workflows/media-service.yml'
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Pinned source-build run containing the candidate artifact'
        required: true
        default: '41346172469'
        type: string
      grid_required:
        description: 'Require full grid reconstruction from the selected candidate'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  windows:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    env:
      CGO_ENABLED: '0'
      GOAMD64: v1
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experimental-media-source-and-binaries
          path: media-candidate
          run-id: ${{ inputs.source_run || github.event.workflow_run.id || '41346172469' }}
          github-token: ${{ github.token }}
      - name: Actual restricted-service media decoding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Checked([string]$exe,[string[]]$a) { & $exe @a; if ($LASTEXITCODE -ne 0) { throw 'Media experiment operation failed' } }
          foreach ($line in Get-Content media-candidate/SHA256SUMS.txt) {
            $parts = $line -split '  ',2
            if ((Get-FileHash (Join-Path media-candidate $parts[1])).Hash.ToLowerInvariant() -ne $parts[0]) { throw 'Candidate checksum mismatch' }
          }
          $root = Join-Path $env:RUNNER_TEMP 'minimal-media-service'
          New-Item -ItemType Directory "$root/tools" -Force | Out-Null
          Copy-Item media-candidate/* "$root/tools"
          foreach ($file in Get-ChildItem experiments/media-worker/fixtures/*.b64) { [IO.File]::WriteAllBytes((Join-Path $root $file.BaseName),[Convert]::FromBase64String((Get-Content $file.FullName -Raw))) }
          Copy-Item experiments/media-worker/fixtures/fixtures.json $root
          Push-Location experiments/media-worker
          Checked go @('mod','verify')
          Checked go @('build','-mod=readonly','-trimpath','-o',"$root/probe.exe",'.')
          Pop-Location
          Checked icacls @($root,'/grant','*S-1-5-19:(OI)(CI)M')
          $name = 'ImmichCloneMediaProbe'
          try {
            $credential = [PSCredential]::new('NT AUTHORITY\LocalService',(ConvertTo-SecureString 'unused' -AsPlainText -Force))
            $gridArg = if ('${{ inputs.grid_required }}' -ne 'false') { ' -require-grid' } else { '' }
            New-Service -Name $name -BinaryPathName ('"'+"$root/probe.exe"+'" -root "'+$root+'"'+$gridArg) -Credential $credential | Out-Null
            Start-Service $name
            if (!(Test-Path "$root/passed.txt")) { throw 'Media service operations not confirmed' }
            Restart-Service $name
            Get-Content "$root/passed.txt"
            Write-Output ('Grid reconstruction argument: '+$gridArg)
            Write-Output 'PASS: source-built CPU H264 HEVC rotated MOV and single-image and 6/48-tile 8-bit HEIC reconstruction, pixel/dimension assertions, BMP-to-PNG thumbnails, immutable originals, malformed rejection, disabled networking, actual child timeout/output limits, preassigned 512MiB job commitment limit, one-process limit, crash recovery, parent-death cleanup and LocalService restart.'
            Get-Content "$root/tools/pe-imports.txt"
            & "$root/tools/ffmpeg.exe" -version
            if ($LASTEXITCODE -ne 0) { throw 'Version execution failed' }
          } finally {
            if (Get-Service $name -ErrorAction SilentlyContinue) { Stop-Service $name -ErrorAction Continue; Checked sc.exe @('delete',$name) }
            if (Test-Path "$root/failed.txt") { Get-Content "$root/failed.txt" }
          }
