name: Milestone 2 production native cross-photo quality
on:
  push:
    paths:
      - '.github/workflows/native-face-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-quality:
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      CGO_ENABLED: '0'
      GOAMD64: v1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experimental-native-ai-build-not-accepted
          path: native-ai-candidate
          run-id: 41551816976
          github-token: ${{ github.token }}
      - name: Execute frozen production Go/provider identity-disjoint screen; aggregate results only
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          $null=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/Test-NativeFaceQuality.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw 'Native quality script syntax invalid' }
          ./scripts/Test-NativeFaceQuality.ps1
