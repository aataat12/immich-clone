name: Large byte-volume backup and independent restore
on:
  push:
    paths:
      - '.github/workflows/backup-large-volume.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  byte-volume:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
      GOAMD64: v1
      IMMICH_LARGE_BACKUP: '1'
      IMMICH_LARGE_TEMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
      - name: Actual archive above 4 GiB, copy cancellation and independent default-budget restore
        shell: pwsh
        run: |
          go test -mod=readonly -v -count=1 -timeout=28m ./internal/library -run '^TestActualLargeVolumeBackupRestore$'
          if ($LASTEXITCODE -ne 0) { throw 'Large byte-volume backup/restore failed' }
