name: Frameout 0.1.44 selection and albums acceptance
# Steps 5–6: final mixed-album browser and intended hidden-control visibility.
on:
  push:
    branches: ['work/release-0.1.44-foundation']
    paths: ['.github/workflows/gallery44-foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gallery44-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
      GOAMD64: v1
      GOTOOLCHAIN: local
      IMMICH_TEST_CURATION: '1'
      IMMICH_TEST_ORGANIZATION: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 90d86bd932234d703c4166e4c47585cfbfd047d5
          path: released-baseline
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify released tag and establish executable 0.1.43 baseline
        if: ${{ !contains(github.event.head_commit.message, '[reuse-baseline]') }}
        shell: pwsh
        run: |
          $tag=git ls-remote --tags origin refs/tags/v0.1.43-prototype
          if (!$tag.StartsWith('90d86bd932234d703c4166e4c47585cfbfd047d5')) {throw 'Release tag mismatch'}
          Push-Location released-baseline
          try {
            go mod verify
            if ($LASTEXITCODE -ne 0) {throw 'Baseline module verification failed'}
            go test -mod=readonly -count=1 -timeout=8m ./internal/... ./cmd/immichclone
            if ($LASTEXITCODE -ne 0) {throw 'Released baseline regression failed'}
            node tests/gallery-dates.cjs
            if ($LASTEXITCODE -ne 0) {throw 'Released date regression failed'}
          } finally {Pop-Location}
      - name: Format candidate and execute shared contract and all retained regressions
        if: ${{ !contains(github.event.head_commit.message, '[browser-only]') }}
        shell: pwsh
        run: |
          ./scripts/Format-Gallery44.ps1
          Write-Host 'GALLERY44_FORMAT_BEGIN'
          git diff --no-ext-diff -- '*.go'
          Write-Host 'GALLERY44_FORMAT_END'
          go mod verify
          if ($LASTEXITCODE -ne 0) {throw 'Module verification failed'}
          go test -mod=readonly -count=1 -v -timeout=10m ./internal/... ./cmd/immichclone
          if ($LASTEXITCODE -ne 0) {throw 'Candidate regression failed'}
          go vet ./internal/... ./cmd/immichclone
          if ($LASTEXITCODE -ne 0) {throw 'Vet failed'}
          node tests/gallery-dates.cjs
          if ($LASTEXITCODE -ne 0) {throw 'Date helpers failed'}
      - name: Prove actual bounded NTFS metadata failure and recovery
        if: ${{ !contains(github.event.head_commit.message, '[browser-only]') }}
        shell: pwsh
        run: ./scripts/Test-FullDisk.ps1
      - name: Exercise real LocalService and Edge with synthetic catalogs
        shell: pwsh
        run: |
          ./scripts/Format-Gallery44.ps1
          if ('${{ contains(github.event.head_commit.message, '[canonical-source]') }}' -eq 'true') {
            git diff --exit-code -- '*.go'
            if ($LASTEXITCODE -ne 0) {throw 'Committed source differs from the accepted canonical Go formatting'}
          }
          $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD='1'
          npm install --prefix "$env:RUNNER_TEMP/gallery44-browser" --no-audit --no-fund playwright@1.62.1
          if ($LASTEXITCODE -ne 0) {throw 'Pinned browser tooling acquisition failed'}
          $env:IMMICH_BROWSER_MODULE="$env:RUNNER_TEMP/gallery44-browser/node_modules/playwright"
          $env:IMMICH_BROWSER_OUTPUT="$env:GITHUB_WORKSPACE/browser-evidence"
          New-Item -ItemType Directory -Path $env:IMMICH_BROWSER_OUTPUT|Out-Null
          $env:IMMICH_VIEWER_VIDEO=Join-Path $env:RUNNER_TEMP 'gallery44-video.mp4'
          ./scripts/New-MediaFixture.ps1 -Destination $env:IMMICH_VIEWER_VIDEO
          ./scripts/Test-Gallery44Foundation.ps1
      - name: Retain only canonical patch and synthetic screenshots
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force gallery44-evidence|Out-Null
          git diff --no-ext-diff -- '*.go' | Set-Content -Encoding utf8NoBOM gallery44-evidence/canonical.patch
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gallery44-foundation-synthetic-evidence
          path: |
            gallery44-evidence/canonical.patch
            browser-evidence/*.png
          retention-days: 7

  installed-metadata:
    needs: foundation
    if: ${{ !contains(github.event.head_commit.message, '[browser-only]') }}
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
      GOAMD64: v1
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experimental-media-source-and-binaries
          path: media-candidate
          run-id: 41346172469
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experimental-native-ai-build-not-accepted
          path: native-ai-candidate
          run-id: 41551816976
          github-token: ${{ github.token }}
      - name: Build internal candidate with the accepted bundled providers
        shell: pwsh
        run: |
          go mod download
          if($LASTEXITCODE -ne 0){throw 'Pinned modules unavailable'}
          go mod verify
          if($LASTEXITCODE -ne 0){throw 'Module verification failed'}
          ./scripts/Format-Gallery44.ps1
          ./scripts/Build-Installer.ps1 -Versions @('0.1.44') -NotesPath docs/metadata-candidate-0.1.44.md
      - name: Prove genuine older reader/writer refusal and actual Setup rollback and restoration
        shell: pwsh
        run: ./scripts/Test-CurationInstalled.ps1
      - name: Retain canonical source patch and candidate identity only
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force metadata-evidence|Out-Null
          git diff --no-ext-diff -- '*.go' | Set-Content -Encoding utf8NoBOM metadata-evidence/canonical.patch
          if(Test-Path dist/ImmichClone-0.1.44-prototype-x64-setup.exe){(Get-FileHash dist/ImmichClone-0.1.44-prototype-x64-setup.exe).Hash|Set-Content metadata-evidence/test-installer-sha256.txt}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: metadata44-sanitized-evidence
          path: metadata-evidence/*
          retention-days: 7
