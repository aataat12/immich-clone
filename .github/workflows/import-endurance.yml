name: Installed bounded mixed import endurance
# Exercise the explicit production library visibility contract on bounded gallery reads.
on:
  push:
    paths:
      - '.github/workflows/import-endurance.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sustained-import:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prototype-server-tested
          path: accepted-installer
          run-id: 41771361544
          github-token: ${{ github.token }}
      - name: Actual installed mixed copies, duplicate replay, restart and all-original checks
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD='1'
          npm install --prefix "$env:RUNNER_TEMP/import-endurance-deps" --no-audit --no-fund playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser tooling unavailable' }
          $env:IMMICH_BROWSER_MODULE="$env:RUNNER_TEMP/import-endurance-deps/node_modules/playwright"
          python -m pip install --only-binary=:all: --require-hashes --no-deps -r experiments/media-ai/requirements.txt --disable-pip-version-check
          if ($LASTEXITCODE -ne 0) { throw 'Pinned fixture tooling unavailable' }
          $env:IMMICH_COMPAT_FIXTURES=Join-Path $env:RUNNER_TEMP 'import-endurance-fixtures'
          python -B experiments/media-compatibility/prepare.py $env:IMMICH_COMPAT_FIXTURES
          if ($LASTEXITCODE -ne 0) { throw 'Independent fixture generation failed' }
          ./scripts/Test-ImportEndurance.ps1
