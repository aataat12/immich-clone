name: Release 0.1.43 independent automatic-name quality
# Acquisition uses the publisher's ordinary official public page/download session.
on:
  push:
    branches: ['work/release-0.1.43']
    paths: ['.github/workflows/release43-independent-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: release43-independent-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent-fei-quality:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
      GOAMD64: v1
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experimental-native-ai-build-not-accepted
          path: native-ai-candidate
          run-id: 41551816976
          github-token: ${{ github.token }}
      - name: Verify independent evaluator and script before native execution
        shell: pwsh
        run: |
          gofmt -w internal/library/automatic_names_fei_test.go
          if ($LASTEXITCODE -ne 0) { throw 'Independent evaluator source syntax invalid' }
          Write-Host 'R43_FEI_CANONICAL_DIFF_BEGIN'
          git diff --no-ext-diff -- internal/library/automatic_names_fei_test.go
          Write-Host 'R43_FEI_CANONICAL_DIFF_END'
          $tokens=$null;$parseErrors=$null
          $null=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/Test-FEIAutomaticNames.ps1'),[ref]$tokens,[ref]$parseErrors)
          if ($parseErrors.Count) { throw 'Independent evaluation script syntax invalid' }
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'Module integrity failed' }
      - name: Execute frozen FEI policy evaluation; aggregate results only
        shell: pwsh
        run: ./scripts/Test-FEIAutomaticNames.ps1
