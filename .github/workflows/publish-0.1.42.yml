name: Publish approved tested 0.1.42 artifact
on:
  push:
    branches: ['work/release-0.1.42']
    paths: ['.github/workflows/publish-0.1.42.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-0.1.42
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Publish exact accepted artifact without rebuilding
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='aataat12/immich-clone'
          $api='https://api.github.com/repos/'+$repo
          $source='f37f61f2fe79deb92eeb3ff614ea6b245180a391'
          $tag='v0.1.42-prototype'
          $headers=@{Accept='application/vnd.github+json';Authorization=('Bearer '+$env:GH_TOKEN);'X-GitHub-Api-Version'='2022-11-28'}
          foreach($runId in @(42147333212,42145872199,42145872202)){
            $expectedSource=if($runId -eq 42147333212){$source}else{'d6f3f1bfe94e0a938a0b0619df6218f2722e013c'}
            $run=Invoke-RestMethod ($api+'/actions/runs/'+$runId) -Headers $headers
            if($run.head_sha -ne $expectedSource -or $run.status -ne 'completed' -or $run.conclusion -ne 'success'){throw 'Required exact-source acceptance did not pass'}
          }
          $artifactId=13471895175
          $zipHash='64338a54ac2654b0f5052f9f7070a65c2b0e141e8fa7680142bcf5b657748330'
          $artifact=Invoke-RestMethod ($api+'/actions/artifacts/'+$artifactId) -Headers $headers
          if($artifact.name -ne 'prototype-0.1.42-server-tested' -or $artifact.expired -or $artifact.workflow_run.head_sha -ne $source -or $artifact.digest -ne ('sha256:'+$zipHash)){throw 'Accepted artifact identity mismatch'}
          $tags=Invoke-RestMethod ($api+'/git/matching-refs/tags/'+$tag) -Headers $headers
          if($tags.Count -ne 0){throw 'Existing tag is never overwritten'}
          $releases=Invoke-RestMethod ($api+'/releases?per_page=100') -Headers $headers
          if(@($releases|Where-Object tag_name -eq $tag).Count){throw 'Existing release is never overwritten'}
          $zip=Join-Path $env:RUNNER_TEMP 'tested-0.1.42.zip'
          Invoke-WebRequest ($api+'/actions/artifacts/'+$artifactId+'/zip') -Headers $headers -OutFile $zip
          if((Get-FileHash $zip).Hash.ToLowerInvariant() -ne $zipHash){throw 'Artifact ZIP hash mismatch'}
          $root=Join-Path $env:RUNNER_TEMP 'tested-0.1.42'
          Expand-Archive -LiteralPath $zip -DestinationPath $root
          $assets=@(
            @{Path='dist/ImmichClone-0.1.42-prototype-x64-setup.exe';Hash='18dbc670ce4d46809e2a90d5831d17b31f633050907290082f1e793294df8b87';Size=104649228},
            @{Path='dist/SHA256SUMS.txt';Hash='1f6f3c0abd6bcf7c3da7a74d5386a6cf755918c53854d1ec1c8a34ef6eb31103';Size=110},
            @{Path='docs/validation-0.1.42.md';Hash='e26a712fc1b0a19d09b260e03f9f59bd4509141a9f1e0a073b91c59b74f5b08e';Size=698},
            @{Path='docs/release-notes-0.1.42.md';Hash='7ce23b4a1de29bd6db2527e02594886ab98f8d4a31bf49cec11b5011ea0d1abf';Size=1057}
          )
          if(@(Get-ChildItem -LiteralPath $root -Recurse -File).Count -ne 4){throw 'Unexpected artifact members'}
          $files=@()
          foreach($asset in $assets){
            $path=Join-Path $root $asset.Path
            if((Get-Item $path).Length -ne $asset.Size -or (Get-FileHash $path).Hash.ToLowerInvariant() -ne $asset.Hash){throw 'Deliverable identity mismatch'}
            $files+=$path
          }
          $body=Get-Content (Join-Path $root 'docs/release-notes-0.1.42.md') -Raw
          $body+="`nExact tested source: $source`n`nCombined Windows Server 2022 acceptance: https://github.com/$repo/actions/runs/42147333212`n`nFocused installer trust: https://github.com/$repo/actions/runs/42145872199`n`nInstaller SHA256: 18dbc670ce4d46809e2a90d5831d17b31f633050907290082f1e793294df8b87`n`nPublished from the exact tested artifact without rebuilding. Milestones 7 and 8 remain incomplete; SEC-05 and SEC-08 remain open. Final Windows 10 clean-machine, reboot and endurance acceptance remains open.`n"
          $bodyFile=Join-Path $env:RUNNER_TEMP 'release-body.md'
          [IO.File]::WriteAllText($bodyFile,$body,[Text.UTF8Encoding]::new($false))
          & gh release create $tag --repo $repo --target $source --title 'Immich Clone 0.1.42 prototype' --draft --prerelease --notes-file $bodyFile @files
          if($LASTEXITCODE -ne 0){throw 'Draft creation failed'}
          $all=Invoke-RestMethod ($api+'/releases?per_page=100') -Headers $headers
          $drafts=@($all|Where-Object tag_name -eq $tag)
          if($drafts.Count -ne 1){throw 'Draft identity is not unique'}
          $release=Invoke-RestMethod ($api+'/releases/'+$drafts[0].id) -Headers $headers
          if(!$release.draft -or !$release.prerelease -or $release.target_commitish -ne $source -or @($release.assets).Count -ne 4){throw 'Draft identity mismatch'}
          foreach($asset in $assets){
            $actual=@($release.assets|Where-Object name -eq (Split-Path $asset.Path -Leaf))
            if($actual.Count -ne 1 -or $actual[0].size -ne $asset.Size -or $actual[0].digest -ne ('sha256:'+$asset.Hash)){throw 'Draft asset mismatch'}
          }
          & gh release edit $tag --repo $repo --draft=false --prerelease
          if($LASTEXITCODE -ne 0){throw 'Release publication failed'}
          $published=Invoke-RestMethod ($api+'/releases/tags/'+$tag) -Headers $headers
          $ref=Invoke-RestMethod ($api+'/git/ref/tags/'+$tag) -Headers $headers
          if($published.draft -or !$published.prerelease -or @($published.assets).Count -ne 4 -or $ref.object.type -ne 'commit' -or $ref.object.sha -ne $source){throw 'Published identity mismatch'}
          Write-Output ('Published '+$published.html_url)
