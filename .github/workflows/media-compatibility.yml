name: Milestone 6 media compatibility matrix
on:
  push:
    paths:
      - '.github/workflows/media-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compatibility:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
      GOAMD64: v1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experimental-media-source-and-binaries
          path: media-candidate
          run-id: 41346172469
          github-token: ${{ github.token }}
      - name: Install only previously pinned CI fixture producers
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes --no-deps -r experiments/media-ai/requirements.txt --disable-pip-version-check
          if ($LASTEXITCODE -ne 0) { throw 'Pinned fixture dependencies unavailable' }
      - name: Check script syntax and execute production image/video matrix and independent restore
        shell: pwsh
        run: |
          foreach ($file in @('scripts/Test-MediaCompatibility.ps1','experiments/media-compatibility/prepare-video.ps1')) {
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw 'Compatibility script syntax invalid' }
          }
          ./scripts/Test-MediaCompatibility.ps1
