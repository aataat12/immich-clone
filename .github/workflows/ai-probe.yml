name: Bounded people and object CPU feasibility
on:
  push:
    paths:
      - 'experiments/ai-probe/**'
      - '.github/workflows/ai-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inference:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
      GOAMD64: v1
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      # Interpreter is experiment tooling, not a chosen shipping prerequisite.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Checksum-pinned public models and actual CPU inference under LocalService
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Checked([string]$exe,[string[]]$a) { & $exe @a; if ($LASTEXITCODE -ne 0) { throw 'AI feasibility operation failed' } }
          $root = Join-Path $env:RUNNER_TEMP 'public-ai-probe'
          $python = (Get-Command python).Source
          Checked $python @('experiments/ai-probe/prepare.py',$root)
          Checked $python @('-m','pip','install','--only-binary=:all:','--require-hashes','--no-deps','--target',"$root/deps",'-r','experiments/ai-probe/requirements.txt','--disable-pip-version-check')
          Copy-Item experiments/ai-probe/probe.py,experiments/ai-probe/prepare.py $root
          Checked $python @('-B',"$root/probe.py",$root)
          Checked go @('mod','download')
          Checked go @('mod','verify')
          Checked go @('build','-mod=readonly','-trimpath','-o',"$root/probe.exe",'./experiments/ai-probe')
          Checked icacls @($root,'/grant','*S-1-5-19:(OI)(CI)M')
          $name = 'ImmichCloneAIProbe'
          try {
            $credential = [PSCredential]::new('NT AUTHORITY\LocalService',(ConvertTo-SecureString 'unused' -AsPlainText -Force))
            New-Service -Name $name -BinaryPathName ('"'+"$root/probe.exe"+'" -root "'+$root+'" -python "'+$python+'"') -Credential $credential | Out-Null
            Start-Service $name
            if (!(Test-Path "$root/passed.json")) { throw 'Service inference evidence absent' }
            Get-Content "$root/passed.json"
            Remove-Item "$root/passed.json"
            Restart-Service $name
            if (!(Test-Path "$root/passed.json")) { throw 'Restart inference evidence absent' }
            Get-Content "$root/passed.json"
            Write-Output 'PASS: real CPU face detection/alignment/embeddings, tiny-fixture separation/grouping, non-face negatives and person/cat/cup object detection under LocalService and restart; input hashes unchanged.'
          } finally {
            if (Get-Service $name -ErrorAction SilentlyContinue) { Stop-Service $name -ErrorAction Continue; Checked sc.exe @('delete',$name) }
            if (Test-Path "$root/failed.txt") { Get-Content "$root/failed.txt" }
          }
