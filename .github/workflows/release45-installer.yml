name: Release 0.1.45 exact installer acceptance

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  installed:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      CGO_ENABLED: '0'
      GOAMD64: v1
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Confirm exact canonical checkout and verified published predecessor
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Acceptance checkout is not the triggering source' }
          ./scripts/Format-Gallery44.ps1
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Release source must already be canonical' }
          $tag = git ls-remote --tags origin refs/tags/v0.1.43-prototype
          if (!$tag -or $tag.Split()[0] -ne '90d86bd932234d703c4166e4c47585cfbfd047d5') { throw 'Published predecessor tag mismatch' }
          $old = Join-Path $env:RUNNER_TEMP 'ImmichClone-0.1.43-prototype-x64-setup.exe'
          Invoke-WebRequest 'https://github.com/aataat12/immich-clone/releases/download/v0.1.43-prototype/ImmichClone-0.1.43-prototype-x64-setup.exe' -OutFile $old
          if ((Get-FileHash -LiteralPath $old).Hash.ToLowerInvariant() -ne '96670e90c4abc55cdc07f480267c6f896b784a2a6c11de9f9f5333edb4158415') { throw 'Published predecessor checksum mismatch' }
          "IMMICH_LEGACY_INSTALLER=$old" >> $env:GITHUB_ENV
          $tag = git ls-remote --tags origin refs/tags/v0.1.44-prototype
          if (!$tag -or $tag.Split()[0] -ne '4e337fd66a022e9026bcf01e4acbc8ef3cdb48db') { throw 'Published 0.1.44 tag mismatch' }
          $prior = Join-Path $env:RUNNER_TEMP 'ImmichClone-0.1.44-prototype-x64-setup.exe'
          Invoke-WebRequest 'https://github.com/aataat12/immich-clone/releases/download/v0.1.44-prototype/ImmichClone-0.1.44-prototype-x64-setup.exe' -OutFile $prior
          if ((Get-FileHash -LiteralPath $prior).Hash.ToLowerInvariant() -ne '58bea76f94a13e501beb91b2ed8844840255c56c0d506f0634e3a9e99df10da9') { throw 'Published 0.1.44 checksum mismatch' }
          "IMMICH_PRIOR_INSTALLER=$prior" >> $env:GITHUB_ENV
      - name: Recover pinned provider inputs from the permanent predecessor installer
        shell: pwsh
        run: |
          if (Get-Service ImmichClone -ErrorAction SilentlyContinue) { throw 'Provider staging requires a disposable runner' }
          if (Test-Path 'HKLM:\SOFTWARE\ImmichClone') { throw 'Existing app registration refused' }
          $leaf = 'ImmichClone-provider-' + [guid]::NewGuid().ToString('N')
          $app = Join-Path $env:ProgramFiles $leaf
          $state = Join-Path $env:ProgramData $leaf
          if ((Test-Path -LiteralPath $app) -or (Test-Path -LiteralPath $state)) { throw 'Provider staging paths must be new' }
          $setup = Start-Process -FilePath $env:IMMICH_PRIOR_INSTALLER -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="'+$app+'"'), ('/STATE="'+$state+'"')
          ) -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw 'Verified predecessor installation failed during provider staging' }
          try {
            Copy-Item -LiteralPath (Join-Path $app 'media/ffmpeg-8.1.3-7eb77d88e2e9') -Destination media-candidate -Recurse
            Copy-Item -LiteralPath (Join-Path $app 'ai/opencv-4.12.0-nr01-zlib-1.3.2-15d1c2ca7ef3') -Destination native-ai-candidate -Recurse
          } finally {
            $uninstall = Start-Process -FilePath (Join-Path $app 'unins000.exe') -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
            ) -Wait -PassThru -WindowStyle Hidden
            if ($uninstall.ExitCode -ne 0 -or (Get-Service ImmichClone -ErrorAction SilentlyContinue) -or
                (Test-Path 'HKLM:\SOFTWARE\ImmichClone')) { throw 'Provider staging failed to retire the fixture installation' }
          }
      - name: Acquire pinned tools and generate public test fixtures
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = '1'
          npm install --prefix "$env:RUNNER_TEMP/release45-browser" --no-audit --no-fund playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned browser dependency unavailable' }
          "IMMICH_BROWSER_MODULE=$env:RUNNER_TEMP/release45-browser/node_modules/playwright" >> $env:GITHUB_ENV
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'installed6A'
          New-Item -ItemType Directory $fixtureRoot | Out-Null
          python -m pip install --only-binary=:all: --require-hashes --no-deps -r experiments/media-ai/requirements.txt --disable-pip-version-check
          if ($LASTEXITCODE -ne 0) { throw 'Pinned media fixture tooling unavailable' }
          python -B experiments/media-ai/prepare.py $fixtureRoot
          if ($LASTEXITCODE -ne 0) { throw 'Media fixture preparation failed' }
          ./experiments/media-ai/prepare.ps1 -Root $fixtureRoot
          "IMMICH_6A_FIXTURES=$fixtureRoot" >> $env:GITHUB_ENV
          $compatRoot = Join-Path $env:RUNNER_TEMP 'installed-media-compatibility'
          python -B experiments/media-compatibility/prepare.py $compatRoot
          if ($LASTEXITCODE -ne 0) { throw 'Independent media compatibility fixtures unavailable' }
          "IMMICH_COMPAT_FIXTURES=$compatRoot" >> $env:GITHUB_ENV
      - name: Build the single release installer with the pinned bundled providers
        shell: pwsh
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { throw 'Pinned modules unavailable' }
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'Module verification failed' }
          ./scripts/Build-Installer.ps1 -Versions @('0.1.45') -NotesPath docs/release-notes-0.1.45.md
      - name: Exercise complete fresh and restored experience, genuine upgrades and rollback
        shell: pwsh
        run: |
          $env:IMMICH_BROWSER_OUTPUT = Join-Path $env:GITHUB_WORKSPACE 'installed-browser-evidence'
          New-Item -ItemType Directory -Force $env:IMMICH_BROWSER_OUTPUT | Out-Null
          $env:IMMICH_VIEWER_VIDEO=Join-Path $env:RUNNER_TEMP 'release45-installed-video.mp4'
          ./scripts/New-MediaFixture.ps1 -Destination $env:IMMICH_VIEWER_VIDEO
          $prior = $env:IMMICH_PRIOR_INSTALLER
          try {
            $env:IMMICH_PRIOR_INSTALLER = $env:IMMICH_LEGACY_INSTALLER
            ./scripts/Test-CurationInstalled.ps1 -ReleaseAcceptance -CandidateVersion '0.1.45'
          } finally {
            $env:IMMICH_PRIOR_INSTALLER = $prior
          }
      - name: Recheck installed native providers, package privacy and recovery regressions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          IMMICH_BROWSER_OUTPUT: ${{ github.workspace }}/installed-browser-evidence
        run: |
          $manifest = Get-Content docs/combined-validation-concurrency.json -Raw | ConvertFrom-Json
          if (!$manifest.accepted -or $manifest.source -notmatch '^[0-9a-f]{40}$' -or [int64]$manifest.run -le 0 -or [int64]$manifest.job -le 0) { throw 'Retained Setup concurrency evidence is missing' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions"
          $headers = @{ Accept='application/vnd.github+json'; Authorization=("Bearer "+$env:GH_TOKEN) }
          $run = Invoke-RestMethod "$api/runs/$($manifest.run)" -Headers $headers
          $job = Invoke-RestMethod "$api/jobs/$($manifest.job)" -Headers $headers
          if ($run.head_sha -ne $manifest.source -or $run.conclusion -ne 'success' -or [int64]$job.run_id -ne [int64]$manifest.run -or $job.conclusion -ne 'success') {
            throw 'Retained Setup concurrency acceptance identity mismatch'
          }
          $env:IMMICH_FULL_CONCURRENCY_SOURCE = $manifest.source
          $env:IMMICH_FULL_CONCURRENCY_RUN = $manifest.run
          ./scripts/Test-Installer.ps1 -Release45
      - name: Verify tested installer remains byte-identical to the built candidate
        shell: pwsh
        run: |
          $name = 'ImmichClone-0.1.45-prototype-x64-setup.exe'
          $hash = (Get-FileHash -LiteralPath "dist/$name").Hash.ToLowerInvariant()
          if ((Get-Content -LiteralPath dist/SHA256SUMS.txt -Raw).Trim() -cne "$hash  $name") { throw 'Tested Setup differs from the built candidate' }
          Write-Host "Accepted Setup SHA256 $hash"
          Write-Host "Accepted Setup bytes $((Get-Item -LiteralPath "dist/$name").Length)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release45-installed-synthetic-evidence
          path: installed-browser-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain only the exact tested installer and release documents
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prototype-0.1.45-server-tested
          path: |
            dist/ImmichClone-0.1.45-prototype-x64-setup.exe
            dist/SHA256SUMS.txt
            docs/release-notes-0.1.45.md
            docs/validation-0.1.45.md
          if-no-files-found: error
          retention-days: 7
