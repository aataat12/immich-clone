name: Actual installed browser import boundary
on:
  push:
    paths:
      - '.github/workflows/installed-import-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installed-boundary:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prototype-server-tested
          path: accepted-installer
          run-id: 41737634745
          github-token: ${{ github.token }}
      - name: Prove actual 4 GiB picker upload interruption and streamed readback
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/boundary-deps" --no-audit --no-fund playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser tooling unavailable' }
          $env:IMMICH_BROWSER_MODULE="$env:RUNNER_TEMP/boundary-deps/node_modules/playwright"
          ./scripts/Test-InstalledImportBoundary.ps1
