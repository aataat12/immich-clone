name: Milestone 6A media AI execution
on:
  push:
    paths:
      - '.github/workflows/media-ai.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  execution:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experimental-media-source-and-binaries
          path: media-candidate
          run-id: 41346172469
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experimental-native-ai-build-not-accepted
          path: native-ai-candidate
          run-id: 41551816976
          github-token: ${{ github.token }}
      - name: Execute analysis-frame limits and timestamp guards
        shell: pwsh
        run: |
          go test -count=1 -timeout=120s ./internal/media
          if ($LASTEXITCODE -ne 0) { throw 'Media tests failed' }
          go test -count=1 ./internal/web -run 'TestSensitiveRouteGuardMatrix|TestBundledScriptsOnlyPolicy|TestAuthenticationHostOriginAndPrivacy'
          if ($LASTEXITCODE -ne 0) { throw 'Group 1 guard regression failed' }
          go vet ./internal/media ./experiments/media-ai
          if ($LASTEXITCODE -ne 0) { throw 'Media vet failed' }
      - name: Generate public HEIC and known-content video fixtures
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData 'Immich 6A 試験'
          New-Item -ItemType Directory "$root/scratch" -Force | Out-Null
          ./scripts/Prepare-MediaProvider.ps1 -Destination "$root/media"
          ./scripts/Prepare-AIProvider.ps1 -Destination "$root/ai"
          python -m pip install --only-binary=:all: --require-hashes --no-deps -r experiments/media-ai/requirements.txt --disable-pip-version-check
          if ($LASTEXITCODE -ne 0) { throw 'Fixture producer failed' }
          python -B experiments/media-ai/prepare.py $root
          if ($LASTEXITCODE -ne 0) { throw 'Fixture preparation failed' }
          ./experiments/media-ai/prepare.ps1 -Root $root
      - name: Actual LocalService HEIC and aspect-preserved timestamped video CPU analysis
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root = Join-Path $env:ProgramData 'Immich 6A 試験'
          go build -o "$root/probe.exe" ./experiments/media-ai
          if ($LASTEXITCODE -ne 0) { throw 'Probe build failed' }
          icacls $root /grant '*S-1-5-19:(OI)(CI)M'
          if ($LASTEXITCODE -ne 0) { throw 'Fixture access failed' }
          $name='ImmichCloneMediaAIProbe'
          try {
            $cred=[PSCredential]::new('NT AUTHORITY\LocalService',(ConvertTo-SecureString 'unused' -AsPlainText -Force))
            New-Service -Name $name -BinaryPathName ('"'+"$root/probe.exe"+'" -root "'+$root+'"') -Credential $cred | Out-Null
            Start-Service $name
            if (!(Test-Path "$root/passed.json")) { throw 'Media AI execution evidence missing' }
            Get-Content "$root/passed.json"
            Remove-Item "$root/passed.json"
            Restart-Service $name
            if (!(Test-Path "$root/passed.json")) { throw 'Media AI restart evidence missing' }
            Get-Content "$root/passed.json"
          } finally {
            if (Test-Path "$root/failed.txt") { Get-Content "$root/failed.txt" }
            if (Get-Service $name -ErrorAction SilentlyContinue) { Stop-Service $name -ErrorAction Continue;sc.exe delete $name }
          }
      - name: Actual 6A application browser jobs and independent recovery
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramData 'Immich 6A 試験'
          try {
            npm install --prefix "$env:RUNNER_TEMP/6a-browser-deps" --no-audit --no-fund playwright@1.62.1
            if ($LASTEXITCODE -ne 0) { throw 'Browser test dependency failed' }
            $env:IMMICH_BROWSER_MODULE = "$env:RUNNER_TEMP/6a-browser-deps/node_modules/playwright"
            ./scripts/Test-MediaAIApplication.ps1 -Fixtures $root
          } finally {
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          }
