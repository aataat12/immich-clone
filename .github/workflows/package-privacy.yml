name: Bounded package privacy checks
on:
  push:
    paths:
      - '.github/workflows/package-privacy.yml'
      - 'scripts/Check-ArtifactPrivacy.py'
      - 'tests/test_artifact_privacy.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-privacy:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Positive negative budget and redaction controls
        run: python tests/test_artifact_privacy.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experimental-native-ai-build-not-accepted
          path: native-privacy-input
          run-id: 41483644241
          github-token: ${{ github.token }}
      - name: Verify worker and inspect actual candidate payload
        shell: pwsh
        run: |
          if ((Get-FileHash native-privacy-input/ai-worker.exe).Hash.ToLowerInvariant() -ne 'cb35f0ccb3e38a6120a6f84fe91d17beaa719f9dcb9329c192b2c885bfb121ba') { throw 'Pinned worker mismatch' }
          python scripts/Check-ArtifactPrivacy.py native-privacy-input
          if ($LASTEXITCODE -ne 0) { throw 'Candidate payload privacy check failed' }
