name: Windows restore progress handoff regression
on:
  push:
    paths:
      - '.github/workflows/restore-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: windows-2022
    timeout-minutes: 6
    env:
      CGO_ENABLED: '0'
      GOAMD64: v1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
      - name: Check real Windows sharing behavior and safe failure detail
        shell: pwsh
        run: |
          go test -mod=readonly -v -count=1 ./internal/library -run 'TestRestoreProgressReadDuringDeleteAccessHandle|TestRestoreFailureDetail'
          if ($LASTEXITCODE -ne 0) { throw 'Restore handoff regression failed' }
