name: ZIP64 entry-count backup and restore acceptance
on:
  push:
    paths:
      - '.github/workflows/backup-zip64-count.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entry-count:
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      CGO_ENABLED: '0'
      GOAMD64: v1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
      - name: Execute 65536-original staged ZIP64 backup and independent default-budget restore
        shell: pwsh
        run: ./scripts/Test-ZIP64EntryCount.ps1
