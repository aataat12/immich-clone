name: Milestone 2 indexed People review acceptance
on:
  push:
    paths:
      - '.github/workflows/people-index.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
      GOAMD64: v1
      IMMICH_PEOPLE_SCALE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
      - name: Actual review scale, correction and independent restore regressions
        shell: pwsh
        run: |
          go test -mod=readonly -v -count=1 -timeout=3m ./internal/library ./internal/web -run 'Organization|Face|Tag|Reanalysis|People'
          if ($LASTEXITCODE -ne 0) { throw 'People scale/correction regression failed' }
          go vet ./internal/library ./internal/web
          if ($LASTEXITCODE -ne 0) { throw 'Vet failed' }
      - name: Actual Edge independent review navigation and corrections
        shell: pwsh
        run: |
          go build -mod=readonly -o "$env:RUNNER_TEMP/people-index.exe" ./cmd/immichclone
          if ($LASTEXITCODE -ne 0) { throw 'App build failed' }
          $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD='1'
          npm install --prefix "$env:RUNNER_TEMP/people-index-deps" --no-audit --no-fund playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser fixture setup failed' }
          $env:IMMICH_BROWSER_MODULE="$env:RUNNER_TEMP/people-index-deps/node_modules/playwright"
          $env:IMMICH_PEOPLE_BINARY="$env:RUNNER_TEMP/people-index.exe"
          node tests/people-index.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Indexed People browser acceptance failed' }
